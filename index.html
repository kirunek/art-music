<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pond — a calm sound space</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="lang-btn" id="langbtn">EN</button>
  </div>

  <nav class="tab-bar" hidden>
    <button class="tab" data-tab="pond" id="tab-btn-pond">pond</button>
    <button class="tab active" data-tab="theremin" id="tab-btn-theremin">theremin</button>
  </nav>

  <div class="tab-section" id="tab-pond">
    <div class="stage">
      <canvas id="pond"></canvas>
      <div id="picker-overlay"></div>
      <div class="hint" id="hint">touch anywhere — pick a family, then a sound</div>
    </div>

    <div class="controls">
      <button class="round" id="playbtn" aria-label="Play">
        <svg class="icon" id="playicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"></polygon>
        </svg>
      </button>

      <div class="tempo-wrap">
        <span class="tempo-label" id="tempo-slow">slow</span>
        <input type="range" id="tempo" min="40" max="120" value="64" step="1" aria-label="Tempo" />
        <span class="tempo-label" id="tempo-lively">lively</span>
      </div>

      <button class="pill" id="clearbtn" aria-label="Clear all">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path>
        </svg>
        <span id="clearlabel">clear</span>
      </button>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="tab-section active" id="tab-theremin">
    <div class="stage" id="theremin-stage">
      <canvas id="theremin-canvas"></canvas>
    </div>

    <div class="theremin-info">
      <span class="theremin-stat" id="theremin-players">—</span>
      <span class="theremin-stat" id="room-code-info"></span>
    </div>

    <div class="sound-selector" id="sound-selector"></div>

    <div class="theremin-controls">
      <button class="ctrl-btn" id="pin-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C9.24 2 7 4.24 7 7c0 3.87 5 11 5 11s5-7.13 5-11c0-2.76-2.24-5-5-5z"/>
          <circle cx="12" cy="7" r="2"/>
        </svg>
        <span>Ноти</span>
      </button>
      <button class="ctrl-btn" id="rec-btn">
        <svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>
        <span>Запис</span>
      </button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <p class="modal-msg" id="modal-msg">Clear all orbs?</p>
    <div class="modal-actions">
      <button class="pill" id="modal-cancel"><span>Cancel</span></button>
      <button class="pill danger" id="modal-confirm"><span>Clear</span></button>
    </div>
  </div>
</div>

<div class="modal-backdrop visible" id="room-modal-backdrop">
  <div class="modal">
    <p class="modal-msg" id="room-modal-title">Введіть код кімнати</p>
    <div class="room-modal-row">
      <input class="room-input" id="room-input" type="text" placeholder="room code"
             maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <button class="pill" id="room-join-btn"><span id="room-join-label">Увійти</span></button>
    </div>
    <div id="room-error" class="room-error-msg" hidden></div>
    <button class="solo-btn" id="solo-btn">Грати самому</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="theremin.js"></script>
</body>
</html>
